[workspace]
resolver = "2"
members = ["crates/avatar-formats", "crates/avatar-export", "crates/avatarextract", "crates/avatar-aura"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
lzxd = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gltf-json = "1.4"

[profile.release]
lto = "thin"
codegen-units = 1
